appId: com.epocanvas.desktop
productName: EpoCanvas AI Workspace
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - "!node_modules/**"
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - dir
